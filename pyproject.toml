[project]
name = "email-agent"
version = "0.2.0"
description = "全功能邮件助理：LangGraph Agent 架构，支持待办提取、会议识别、草拟回复、跟进追踪、RAG 历史检索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imapclient>=2.3.1",
    "beautifulsoup4>=4.12.2",
    "python-dateutil>=2.9.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "openai>=1.51.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    # LangChain / LangGraph
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    # Vector store & retrieval
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
    "sentence-transformers>=3",
    # Pydantic v2 (LangChain dependency)
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = []

